    <!-- JavaScript for Booking System -->
    <script>
        // Booking system state
        let currentStep = 1;
        let bookingData = {
            service: null,
            addons: [],
            therapist: null,
            date: null,
            time: null,
            clientInfo: {}
        };

        // Initialize booking system
        document.addEventListener('DOMContentLoaded', function() {
            initializeMobileMenu();
            initializeBookingSystem();
            initializeCalendar();
            updateProgressIndicator();
        });

        // Mobile menu functionality
        function initializeMobileMenu() {
            document.getElementById('mobile-menu-toggle').addEventListener('click', function() {
                const mobileMenu = document.getElementById('mobile-menu');
                mobileMenu.classList.toggle('hidden');
            });
        }

        // Initialize booking system
        function initializeBookingSystem() {
            // Service selection
            document.querySelectorAll('.service-option').forEach(option => {
                option.addEventListener('click', function() {
                    // Remove previous selection
                    document.querySelectorAll('.service-option').forEach(opt => {
                        opt.classList.remove('border-primary', 'bg-primary-50');
                        opt.classList.add('border-primary-100');
                    });
                    
                    // Add selection styling
                    this.classList.remove('border-primary-100');
                    this.classList.add('border-primary', 'bg-primary-50');
                    
                    // Store service data
                    bookingData.service = {
                        id: this.dataset.service,
                        name: this.querySelector('h4').textContent,
                        price: parseInt(this.dataset.price),
                        duration: this.dataset.duration
                    };
                    
                    updateBookingSummary();
                });
            });

            // Add-on selection
            document.querySelectorAll('.addon-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    if (this.checked) {
                        bookingData.addons.push({
                            id: this.dataset.addon,
                            name: this.parentElement.querySelector('span').textContent.split('+')[0].trim(),
                            price: parseInt(this.dataset.price)
                        });
                    } else {
                        bookingData.addons = bookingData.addons.filter(addon => addon.id !== this.dataset.addon);
                    }
                    updateBookingSummary();
                });
            });

            // Therapist selection
            document.querySelectorAll('.therapist-option').forEach(option => {
                option.addEventListener('click', function() {
                    // Remove previous selection
                    document.querySelectorAll('.therapist-option').forEach(opt => {
                        opt.classList.remove('border-primary', 'bg-primary-50');
                        opt.classList.add('border-primary-100');
                    });
                    
                    // Add selection styling
                    this.classList.remove('border-primary-100');
                    this.classList.add('border-primary', 'bg-primary-50');
                    
                    // Store therapist data
                    bookingData.therapist = {
                        id: this.dataset.therapist,
                        name: this.querySelector('h3').textContent
                    };
                    
                    updateBookingSummary();
                });
            });

            // Navigation buttons
            document.getElementById('next-step').addEventListener('click', nextStep);
            document.getElementById('prev-step').addEventListener('click', prevStep);
            document.getElementById('confirm-booking').addEventListener('click', confirmBooking);

            // Service search and filter
            document.getElementById('service-search').addEventListener('input', filterServices);
            document.getElementById('service-filter').addEventListener('change', filterServices);
        }

        // Filter services
        function filterServices() {
            const searchTerm = document.getElementById('service-search').value.toLowerCase();
            const categoryFilter = document.getElementById('service-filter').value;
            
            document.querySelectorAll('.service-category').forEach(category => {
                const categoryType = category.dataset.category;
                const shouldShowCategory = !categoryFilter || categoryFilter === categoryType;
                
                if (shouldShowCategory) {
                    const services = category.querySelectorAll('.service-option');
                    let hasVisibleServices = false;
                    
                    services.forEach(service => {
                        const serviceName = service.querySelector('h4').textContent.toLowerCase();
                        const serviceDescription = service.querySelector('p').textContent.toLowerCase();
                        const matchesSearch = serviceName.includes(searchTerm) || serviceDescription.includes(searchTerm);
                        
                        if (matchesSearch) {
                            service.style.display = 'block';
                            hasVisibleServices = true;
                        } else {
                            service.style.display = 'none';
                        }
                    });
                    
                    category.style.display = hasVisibleServices ? 'block' : 'none';
                } else {
                    category.style.display = 'none';
                }
            });
        }

        // Initialize calendar
        function initializeCalendar() {
            const currentDate = new Date();
            generateCalendar(currentDate);
            
            document.getElementById('prev-month').addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() - 1);
                generateCalendar(currentDate);
            });
            
            document.getElementById('next-month').addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() + 1);
                generateCalendar(currentDate);
            });
        }

        // Generate calendar
        function generateCalendar(date) {
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            
            document.getElementById('current-month').textContent = `${monthNames[date.getMonth()]} ${date.getFullYear()}`;
            
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
            const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());
            
            const calendarGrid = document.getElementById('calendar-grid');
            calendarGrid.innerHTML = '';
            
            for (let i = 0; i < 42; i++) {
                const cellDate = new Date(startDate);
                cellDate.setDate(startDate.getDate() + i);
                
                const dayElement = document.createElement('button');
                dayElement.textContent = cellDate.getDate();
                dayElement.className = 'w-10 h-10 text-sm rounded-lg transition-colors';
                
                const today = new Date();
                const isToday = cellDate.toDateString() === today.toDateString();
                const isCurrentMonth = cellDate.getMonth() === date.getMonth();
                const isPast = cellDate < today && !isToday;
                
                if (isPast) {
                    dayElement.className += ' text-text-secondary cursor-not-allowed';
                    dayElement.disabled = true;
                } else if (isCurrentMonth) {
                    dayElement.className += ' text-text-primary hover:bg-primary-50 hover:text-primary';
                    if (isToday) {
                        dayElement.className += ' bg-primary text-white';
                    }
                } else {
                    dayElement.className += ' text-text-secondary';
                }
                
                if (!isPast && isCurrentMonth) {
                    dayElement.addEventListener('click', function() {
                        // Remove previous selection
                        document.querySelectorAll('#calendar-grid button').forEach(btn => {
                            btn.classList.remove('bg-primary', 'text-white');
                            if (!btn.disabled && btn.textContent === today.getDate().toString() && 
                                cellDate.getMonth() === today.getMonth()) {
                                btn.classList.add('bg-primary', 'text-white');
                            }
                        });
                        
                        // Add selection styling
                        this.classList.add('bg-primary', 'text-white');
                        
                        // Store selected date
                        bookingData.date = cellDate.toDateString();
                        
                        // Generate time slots
                        generateTimeSlots(cellDate);
                        updateBookingSummary();
                    });
                }
                
                calendarGrid.appendChild(dayElement);
            }
        }

        // Generate time slots
        function generateTimeSlots(selectedDate) {
            const timeSlotsContainer = document.getElementById('time-slots');
            timeSlotsContainer.innerHTML = '';
            
            const timeSlots = [
                '9:00 AM', '9:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM',
                '12:00 PM', '12:30 PM', '1:00 PM', '1:30 PM', '2:00 PM', '2:30 PM',
                '3:00 PM', '3:30 PM', '4:00 PM', '4:30 PM', '5:00 PM', '5:30 PM',
                '6:00 PM', '6:30 PM', '7:00 PM'
            ];
            
            timeSlots.forEach(time => {
                const timeButton = document.createElement('button');
                timeButton.textContent = time;
                timeButton.className = 'w-full p-3 text-left border border-primary-100 rounded-lg hover:border-primary hover:bg-primary-50 transition-colors';
                
                // Randomly make some slots unavailable for demo
                const isAvailable = Math.random() > 0.3;
                if (!isAvailable) {
                    timeButton.className += ' opacity-50 cursor-not-allowed';
                    timeButton.disabled = true;
                    timeButton.innerHTML += ' <span class="text-xs text-error">(Unavailable)</span>';
                } else {
                    timeButton.addEventListener('click', function() {
                        // Remove previous selection
                        document.querySelectorAll('#time-slots button').forEach(btn => {
                            btn.classList.remove('border-primary', 'bg-primary-50');
                            btn.classList.add('border-primary-100');
                        });
                        
                        // Add selection styling
                        this.classList.remove('border-primary-100');
                        this.classList.add('border-primary', 'bg-primary-50');
                        
                        // Store selected time
                        bookingData.time = time;
                        updateBookingSummary();
                    });
                }
                
                timeSlotsContainer.appendChild(timeButton);
            });
        }

        // Update booking summary
        function updateBookingSummary() {
            // Service
            if (bookingData.service) {
                document.getElementById('summary-service').classList.remove('hidden');
                document.getElementById('selected-service-name').textContent = bookingData.service.name;
                document.getElementById('selected-service-duration').textContent = bookingData.service.duration + ' minutes';
                document.getElementById('selected-service-price').textContent = '$' + bookingData.service.price;
            }
            
            // Add-ons
            if (bookingData.addons.length > 0) {
                document.getElementById('summary-addons').classList.remove('hidden');
                const addonsContainer = document.getElementById('selected-addons');
                addonsContainer.innerHTML = '';
                bookingData.addons.forEach(addon => {
                    const addonElement = document.createElement('div');
                    addonElement.className = 'flex justify-between text-sm';
                    addonElement.innerHTML = `
                        <span class="text-text-secondary">${addon.name}</span>
                        <span class="text-accent">+$${addon.price}</span>
                    `;
                    addonsContainer.appendChild(addonElement);
                });
            }
            
            // Therapist
            if (bookingData.therapist) {
                document.getElementById('summary-therapist').classList.remove('hidden');
                document.getElementById('selected-therapist-name').textContent = bookingData.therapist.name;
            }
            
            // Date & Time
            if (bookingData.date) {
                document.getElementById('summary-datetime').classList.remove('hidden');
                document.getElementById('selected-date').textContent = new Date(bookingData.date).toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }
            
            if (bookingData.time) {
                document.getElementById('selected-time').textContent = bookingData.time;
            }
            
            // Total price
            let total = bookingData.service ? bookingData.service.price : 0;
            total += bookingData.addons.reduce((sum, addon) => sum + addon.price, 0);
            document.getElementById('total-price').textContent = '$' + total;
        }

        // Navigation functions
        function nextStep() {
            if (validateCurrentStep()) {
                if (currentStep < 4) {
                    currentStep++;
                    showStep(currentStep);
                    updateProgressIndicator();
                }
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                showStep(currentStep);
                updateProgressIndicator();
            }
        }

        function showStep(step) {
            // Hide all steps
            document.querySelectorAll('.booking-step').forEach(stepElement => {
                stepElement.classList.add('hidden');
            });
            
            // Show current step
            document.getElementById(`step-${step}`).classList.remove('hidden');
            
            // Update navigation buttons
            const prevButton = document.getElementById('prev-step');
            const nextButton = document.getElementById('next-step');
            const confirmButton = document.getElementById('confirm-booking');
            
            if (step === 1) {
                prevButton.classList.add('hidden');
            } else {
                prevButton.classList.remove('hidden');
            }
            
            if (step === 4) {
                nextButton.classList.add('hidden');
                confirmButton.classList.remove('hidden');
            } else {
                nextButton.classList.remove('hidden');
                confirmButton.classList.add('hidden');
            }
        }

        function updateProgressIndicator() {
            for (let i = 1; i <= 4; i++) {
                const indicator = document.getElementById(`step-${i}-indicator`);
                const text = document.getElementById(`step-${i}-text`);
                const progress = document.getElementById(`progress-${i}`);
                
                if (i < currentStep) {
                    // Completed step
                    indicator.className = 'w-8 h-8 rounded-full bg-success text-white flex items-center justify-center text-sm font-medium';
                    indicator.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                    text.className = 'text-success font-medium';
                    if (progress) progress.style.width = '100%';
                } else if (i === currentStep) {
                    // Current step
                    indicator.className = 'w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-medium';
                    indicator.textContent = i;
                    text.className = 'text-primary font-medium';
                    if (progress) progress.style.width = '0%';
                } else {
                    // Future step
                    indicator.className = 'w-8 h-8 rounded-full bg-primary-100 text-text-secondary flex items-center justify-center text-sm font-medium';
                    indicator.textContent = i;
                    text.className = 'text-text-secondary';
                    if (progress) progress.style.width = '0%';
                }
            }
        }

        function validateCurrentStep() {
            switch (currentStep) {
                case 1:
                    if (!bookingData.service) {
                        alert('Please select a service before continuing.');
                        return false;
                    }
                    break;
                case 2:
                    if (!bookingData.therapist) {
                        alert('Please select a therapist before continuing.');
                        return false;
                    }
                    break;
                case 3:
                    if (!bookingData.date || !bookingData.time) {
                        alert('Please select both date and time before continuing.');
                        return false;
                    }
                    break;
                case 4:
                    const form = document.getElementById('client-form');
                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return false;
                    }
                    break;
            }
            return true;
        }

        function confirmBooking() {
            if (validateCurrentStep()) {
                // Collect form data
                const formData = new FormData(document.getElementById('client-form'));
                bookingData.clientInfo = Object.fromEntries(formData);
                
                // Show confirmation
                alert('Booking confirmed! You will receive a confirmation email shortly.');
                
                // Redirect to homepage or confirmation page
                window.location.href = 'homepage.html';
            }
        }
    </script>
